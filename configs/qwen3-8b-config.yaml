# Configuration for train_entry.py with vLLM Engine inference (nested config format)
#
# GPU allocation:
#   - 2 GPUs for inference (duplicate mode: each engine has full model copy)
#   - 2 GPUs for training (DP/FSDP: model sharded across 2 GPUs)
#   - Total: 4 GPUs
#
# Installation:
#   pip install -e ".[vllm]"  # Install vLLM backend
#
# Usage:
#   python -m torchspec.train_entry --config configs/vllm_qwen3_8b.yaml
#
# Note: Uses vLLM's extract_hidden_states speculative method with MooncakeHiddenStatesConnec

model:
  target_model_path: Qwen/Qwen3-8B
  trust_remote_code: true
  draft_model_config: /home/jpollok/TorchSpec/configs/draft_models/qwen3_8b_eagle3.json

dataset:
  train_data_path: "/home/jpollok/training/am_90k.jsonl"
  eval_data_path: "/home/jpollok/training/50eval.jsonl"
  eval_interval: 500
  chat_template: qwen
  prompt_key: messages 


logging:
  report_to: wandb
  use_wandb: true
  wandb_project: "train_qwen3_8b"
  wandb_mode: online

training:
  attention_backend: flex_attention
  micro_batch_size: 1
  draft_accumulation_steps: 1
  learning_rate: 3e-4
  num_train_steps: 10
  max_concurrent_batches: 1
  max_grad_norm: 0.5
  max_seq_length: 25000
  num_epochs: 3
  seed: 42
  training_num_gpus_per_node: 2
  training_num_nodes: 1
  ttt_length: 3
  save_per_epoch: true
  warmup_ratio: 0.03
  gradient_checkpointing: true
  fsdp_reduce_dtype: bfloat16
  fsdp_strategy: FULL_SHARD

inference:
  inference_engine_type: vllm
  inference_num_gpus: 2
  inference_num_gpus_per_engine: 2
  inference_num_gpus_per_node: 2
  max_sample_pool_size: 64
  inference_buffer_threshold: 32
  inference_batch_size: 8
  vllm:
    tp_size: 1
    mem_fraction_static: 0.7
    extra_args:
      max_model_len: 25000
      max_num_batched_tokens: 25000

mooncake:
  master_server_address: null
  metadata_server: null
  protocol: tcp
  global_segment_size: 16GB
  local_buffer_size: 2GB

output_dir: ./outputs/qwen3-8b-SpeedTest
cache_dir: /home/jpollok/.cache
model_download_dir: null
